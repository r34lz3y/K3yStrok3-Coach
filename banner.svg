<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Keystroke Coach: type faster, learn anything">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#29E6FF" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29E6FF" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#29E6FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF8A1F" stop-opacity=".08"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .dash{stroke-dasharray:22 12;animation:run 1.4s linear infinite}
      @keyframes run{to{stroke-dashoffset:-34}}
      @media (prefers-reduced-motion:reduce){.dash{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="340" rx="18" fill="#01070D"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#sky)"/>

  <!-- rogue light cycle trails -->
  <g fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linejoin="round" filter="url(#glow)">
    <path d="M70 0V60H120V190"/>
    <path d="M1150 0V50H1100V170"/>
  </g>
  <g fill="#03141C" stroke="#FF8A1F" stroke-width="2.5" filter="url(#glow)">
    <rect x="112" y="190" width="16" height="34" rx="7"/>
    <rect x="1092" y="170" width="16" height="34" rx="7"/>
  </g>

  <!-- player trail -->
  <path d="M600 340C600 320 640 305 700 300" fill="none" stroke="#29E6FF" stroke-width="3" filter="url(#glow)"/>

  <!-- title -->
  <text x="600" y="150" text-anchor="middle" font-family="'Orbitron','Eurostile','Arial Black',Verdana,sans-serif" font-weight="900" font-size="72" letter-spacing="6" fill="#E8FBFF" filter="url(#glow)">KEYSTROKE COACH</text>
  <text x="600" y="200" text-anchor="middle" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="24" fill="#8FDDEB">Type faster. Listen better. Learn anything.</text>

  <!-- firewall -->
  <line x1="0" y1="262" x2="1200" y2="262" stroke="#29E6FF" stroke-opacity=".35" stroke-width="7"/>
  <line class="dash" x1="0" y1="262" x2="1200" y2="262" stroke="#29E6FF" stroke-width="2.5"/>
  <text x="1180" y="284" text-anchor="end" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#7FA9B5">FIREWALL</text>
  <text x="24" y="316" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="15" fill="#7FA9B5">&gt; built with Claude</text>
</svg>
